<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مولّد فواتير ARMZ</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#181b21;--mu:#6a7280;--bd:#d7dae1;--ac:#1f3a8a;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2127;--tx:#eceef2;--mu:#9aa1ad;--bd:#343842;--ac:#7d98f2;--acx:#0b1020}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2127;--tx:#eceef2;--mu:#9aa1ad;--bd:#343842;--ac:#7d98f2;--acx:#0b1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
.app{display:grid;grid-template-columns:400px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mu);font-size:13px;margin:0 0 14px}
h2{font-size:14px;margin:18px 0 8px;color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;direction:ltr;text-align:left}
textarea{resize:vertical;min-height:54px}
select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.item{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin:7px 0;color:var(--tx);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 12px}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700;width:100%;padding:13px;font-size:16px;margin-top:14px}
button:disabled{opacity:.6;cursor:wait}
.x{color:#c0392b;padding:4px 9px}
.pvwrap{overflow:hidden;direction:ltr;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff}
#scale{transform-origin:top left;width:794px}
.inv{width:794px;height:1122px;background:#fff;color:#000;position:relative;font-family:"Times New Roman",Times,serif;font-size:14px;direction:ltr;text-align:left;overflow:hidden}
.hd{position:absolute;top:44px;left:48px;right:48px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid #333;padding-bottom:2px}
.hd img{height:64px}.hd .a{color:#e11;font-size:40px;font-weight:700;line-height:1}.hd .b{color:#e11;font-size:21px;font-weight:700;line-height:1.1;padding-bottom:3px}
.ft{position:absolute;bottom:36px;left:62px;right:62px;border-top:1px solid #333;padding-top:6px;text-align:center;font-size:11px}
.body{position:absolute;top:150px;left:60px;right:60px}
.meta{display:flex;justify-content:space-between;font-size:13.5px}
.ttl{text-align:center;font-size:17px;margin-top:2px}.trn{text-align:center;font-size:20px}
.cl{margin-top:38px;font-weight:700;font-size:13.5px;line-height:1.35}.cl .n{font-weight:400}
.pj{margin-top:14px;font-weight:700;text-decoration:underline;font-size:13.5px}
.it{font-size:14.5px;line-height:1.3}
.sec{margin-top:18px;font-weight:700;font-size:11px;text-decoration:underline}
table.t{width:100%;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:14.5px}
table.t th,table.t td{border:1px solid #222;padding:5px 6px;text-align:center}
table.t th{background:#d9d9d9}table.t td.d{text-align:left;white-space:pre-line}
table.t tr.tt td{font-weight:700;background:#f2f2f2}table.t tr.tt td[colspan]{text-align:right}
table.s{margin:2px 0 0 auto;width:358px;border-collapse:collapse;font-size:13.5px}
table.s td{border:1px solid #222;padding:1px 6px}table.s td+td{text-align:right;font-weight:700;width:112px}
.w{text-align:center;margin-top:36px;font-size:14px}
.ac{margin-top:44px;font-size:13.5px}
.sg{position:relative;margin-top:26px;font-size:13.5px;height:150px}
.sg img.sig{position:absolute;left:0;top:30px;width:118px;z-index:2}
.sg img.stp{position:absolute;left:138px;top:-8px;width:150px;opacity:.95;z-index:1}
.sg .nm{position:absolute;top:72px;left:0;font-weight:700;font-family:Arial,sans-serif;font-size:13.5px;line-height:1.3;z-index:3}
.sg .nm u{display:block}
.hide{visibility:hidden}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>مولّد فواتير ARMZ</h1>
    <p class="sub">املا البيانات والمعاينة بتتحدّث على طول، وبعدين دوس تحميل PDF.</p>
    <div id="fields"></div>
    <h2>البنود</h2>
    <div id="items"></div>
    <button type="button" id="add">+ إضافة بند</button>
    <h2>جدول الإجماليات (الفلوس)</h2>
    <div id="rows"></div>
    <div class="row"><button type="button" id="addrow">+ إضافة صف</button><button type="button" id="rowsreset">↺ الصفوف الأصلية</button></div>
    <h2>الطباعة</h2>
    <label class="chk"><input type="checkbox" id="oStamp" checked> الختم</label>
    <label class="chk"><input type="checkbox" id="oSign" checked> التوقيع</label>
    <label class="chk"><input type="checkbox" id="oHead" checked> الـ Letterhead (الهيدر والفوتر)</label>
    <button class="pri" id="dl" type="button">⬇ تحميل PDF</button>
    <button type="button" id="reset" style="margin-top:8px;width:100%">رجوع للبيانات الأصلية</button>
  </div>
  <div><div class="pvwrap" id="wrap"><div id="scale"><div class="inv" id="inv"></div></div></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

try{await html2pdf().set({margin:0,filename:nm,image:{type:"jpeg",quality:.98},html2canvas:{scale:2.5,useCORS:true,backgroundColor:"#fff",windowWidth:794},jsPDF:{unit:"px",format:[794,1122],orientation:"portrait",hotfixes:["px_scaling"]}}).from(host.firstChild).save()}
catch(e){alert("حصل خطأ في إنشاء الـ PDF، جرّب تاني.")}
host.remove();b.disabled=false;b.textContent="⬇ تحميل PDF"};
const HINT={approved:"بيتحسب تلقائي من قيم البنود",work:"بيتحسب تلقائي من نسبة الإنجاز",vat:"بيتحسب تلقائي حسب نسبة الضريبة (فوق)",total:"بيتحسب تلقائي"};
function buildRows(){$("rows").innerHTML=S.rows.map((r,k)=>'<div class="item"><div class="row"><input type="text" data-r="'+k+'" data-f="l" value="'+esc(r.l)+'">'+(r.t!=="total"?'<button type="button" class="x" data-rdel="'+k+'">حذف</button>':"")+'</div>'+(r.t==="custom"?'<div class="row" style="margin-top:6px"><input type="number" step="any" data-r="'+k+'" data-f="a" value="'+esc(r.a)+'"><select data-r="'+k+'" data-f="m"><option value="none"'+(r.m==="none"?" selected":"")+'>للعرض فقط</option><option value="add"'+(r.m==="add"?" selected":"")+'>يُضاف للإجمالي</option><option value="sub"'+(r.m==="sub"?" selected":"")+'>يُخصم من الإجمالي</option></select></div>':'<div class="sub" style="margin:4px 0 0">'+HINT[r.t]+'</div>')+'</div>').join("")}
function onRow(e){const t=e.target;if(t.dataset.r!==undefined){S.rows[t.dataset.r][t.dataset.f]=t.value;render()}}
$("rows").addEventListener("input",onRow);$("rows").addEventListener("change",onRow);
$("rows").addEventListener("click",e=>{const d=e.target.dataset.rdel;if(d!==undefined){S.rows.splice(+d,1);buildRows();render()}});
$("addrow").onclick=()=>{let i=S.rows.findIndex(r=>r.t==="total");if(i<0)i=S.rows.length;S.rows.splice(i,0,{t:"custom",l:"DISCOUNT",a:"0",m:"none"});buildRows();render()};
$("rowsreset").onclick=()=>{S.rows=JSON.parse(JSON.stringify(DEF.rows));buildRows();render()};
addEventListener("resize",fit);
buildFields();buildItems();buildRows();render();
</script>
